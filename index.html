<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>바카라 마틴 메이커</title>
  <style>
    :root{
      --bg1:#1d2b53;
      --bg2:#0d132b;
      --panel:#14213d;
      --panel-soft:#182749;
      --panel-stroke:#355cbb;
      --input-bg:#223661;
      --input-stroke:#5879c6;
      --player:#4f9dff;
      --banker:#ff5c5c;
      --win:#40d17f;
      --loss:#ff7b7b;
      --accent1:#ffd000;
      --accent2:#ff7b00;
      --accent3:#6f89ff;
      --text-sub:#dde5ff;
      --text-hint:#a9b8e8;
      --white:#fff;
      --shadow:0 14px 34px rgba(0, 0, 0, .25);
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Noto Sans KR", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top, rgba(120,142,255,.16), transparent 28%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      -webkit-tap-highlight-color: transparent;
    }
    .wrap{
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }
    .topbar{
      display:flex;
      justify-content:flex-end;
      margin-bottom: 8px;
    }
    .version{
      display:inline-flex;
      align-items:center;
      height:28px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:#eaf1ff;
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
      backdrop-filter: blur(8px);
    }
    h1{
      margin: 6px 0 8px;
      font-size: 28px;
      letter-spacing: -.3px;
    }
    .desc{
      margin: 0 0 16px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.5;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 14px;
      backdrop-filter: blur(10px);
      margin-bottom: 14px;
    }
    .page.hidden{
      display:none;
    }
    .hidden{
      display:none !important;
    }
    .section-title{
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 900;
      color: #eef3ff;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .field.full{ grid-column: 1 / -1; }
    .label{
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
    }
    .input{
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 2px solid var(--input-stroke);
      background: var(--input-bg);
      color: var(--white);
      padding: 0 14px;
      font-size: 18px;
      outline: none;
    }
    .input::placeholder{ color: var(--text-hint); }
    .btn-row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .decision-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn{
      height: 52px;
      border: 0;
      border-radius: 16px;
      color: var(--white);
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
    }
    .btn.primary{
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
    }
    .btn.win{
      background: linear-gradient(90deg, #1ea85d, #40d17f);
    }
    .btn.loss{
      background: linear-gradient(90deg, #d74848, #ff7b7b);
    }
    .btn.secondary{
      background: linear-gradient(90deg, #4a5b86, #6b7da8);
    }
    .btn.gameover{
      background: linear-gradient(90deg, #7b4dff, #4e7cff);
      grid-column: 1 / -1;
    }
    .btn.hidden{
      display:none;
    }
    .btn:disabled{
      cursor:not-allowed;
      opacity:.45;
      filter: grayscale(.25);
    }
    .stats{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat{
      border-radius: 18px;
      background: rgba(20,33,61,.9);
      border: 1px solid rgba(255,255,255,.08);
      padding: 12px;
    }
    .stat-label{
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .stat-value{
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.3px;
    }
    .stat-value.player{ color: var(--player); }
    .stat-value.banker{ color: var(--banker); }
    .game-stack{
      display:flex;
      flex-direction:column;
      gap: 14px;
    }
    .game-stat{
      border-radius: 18px;
      background: rgba(20,33,61,.9);
      border: 1px solid rgba(255,255,255,.08);
      padding: 14px;
    }
    .game-stat-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items:center;
    }
    .game-stat-split{
      min-width: 0;
    }
    .game-stat-title{
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .game-stat-value{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.3px;
    }
    .game-actions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .game-reset{
      margin-top: 4px;
    }
    .shuffle-box{
      position: relative;
      height: 188px;
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,.12);
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.12), transparent 30%),
        linear-gradient(180deg, #18305c, #0f1935);
      overflow:hidden;
    }
    .shuffle-box.active .deck-card.left{
      animation: shuffleLeft .5s ease-in-out infinite alternate;
    }
    .shuffle-box.active .deck-card.right{
      animation: shuffleRight .5s ease-in-out infinite alternate;
    }
    .table-glow{
      position:absolute;
      inset:auto 24px 18px;
      height:60px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(37, 214, 118, .35), rgba(37, 214, 118, .02) 72%);
      filter: blur(10px);
    }
    .deck-card{
      position:absolute;
      top: 42px;
      width: 92px;
      height: 126px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #e8eefc);
      box-shadow: 0 12px 24px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .deck-card::before{
      content:"";
      width: 66px;
      height: 92px;
      border-radius: 12px;
      background:
        repeating-linear-gradient(45deg, #214c9d 0 8px, #193b79 8px 16px);
      border: 3px solid #f7fbff;
    }
    .deck-card.left{ left: calc(50% - 88px); transform: rotate(-10deg); }
    .deck-card.right{ left: calc(50% - 4px); transform: rotate(10deg); }
    .result-side{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 10px;
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease;
    }
    .result-side.show{ opacity:1; }
    .side-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 178px;
      height: 62px;
      padding: 0 20px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,.18);
      font-size: 28px;
      font-weight: 900;
      box-shadow: var(--shadow);
    }
    .side-badge.player{
      background: rgba(79,157,255,.18);
      color: var(--player);
    }
    .side-badge.banker{
      background: rgba(255,92,92,.18);
      color: var(--banker);
    }
    .side-meta{
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
    }
    .hint{
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-sub);
      opacity: .95;
      line-height: 1.45;
    }
    .summary{
      margin: 0;
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 700;
      line-height: 1.55;
    }
    .history{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-top: 12px;
    }
    .history.empty{
      min-height: 84px;
      align-items:center;
      justify-content:center;
      color: var(--text-sub);
      border-radius: 18px;
      border: 1px dashed rgba(255,255,255,.15);
      background: rgba(255,255,255,.03);
    }
    .history-item{
      border-radius: 18px;
      background: rgba(20,33,61,.92);
      border: 1px solid rgba(255,255,255,.07);
      padding: 12px;
    }
    .history-top{
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:center;
      margin-bottom: 8px;
    }
    .history-round{
      font-size: 14px;
      font-weight: 900;
    }
    .history-status{
      font-size: 13px;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .history-status.win{
      color: var(--win);
      background: rgba(64,209,127,.12);
    }
    .history-status.loss{
      color: var(--loss);
      background: rgba(255,123,123,.12);
    }
    .history-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .history-grid strong{
      color: var(--white);
      font-weight: 900;
    }
    .end-box{
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }
    .end-box.hidden{ display:none; }
    .end-title{
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .end-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .end-item{
      border-radius: 16px;
      background: rgba(20,33,61,.88);
      padding: 12px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .end-label{
      color: var(--text-sub);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .end-value{
      font-size: 21px;
      font-weight: 900;
    }
    @keyframes shuffleLeft{
      0%{ transform: translateX(0) rotate(-10deg); }
      100%{ transform: translateX(30px) rotate(10deg); }
    }
    @keyframes shuffleRight{
      0%{ transform: translateX(0) rotate(10deg); }
      100%{ transform: translateX(-30px) rotate(-10deg); }
    }
    @media (max-width: 430px){
      .grid, .stats, .end-grid{ grid-template-columns: 1fr; }
      .btn-row, .decision-row, .game-actions{ grid-template-columns: 1fr; }
      .side-badge{ min-width: 100%; }
      .history-grid{ grid-template-columns: 1fr; }
      .deck-card.left{ left: calc(50% - 82px); }
      .deck-card.right{ left: calc(50% - 10px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="version">2026년 7월 30일 - 1</div>
    </div>

    <h1>바카라 마틴 메이커</h1>
    <p class="desc">1페이지에서 금액을 세팅하고 시작하면 2페이지로 넘어가 게임이 진행됩니다. 초기화하면 다시 설정 페이지로 돌아갑니다.</p>

    <div id="setupPage" class="page">
      <section class="card">
        <h2 class="section-title">1p 금액 세팅</h2>
        <div class="grid">
          <label class="field">
            <span class="label">마틴횟수</span>
            <input id="martinLimitInput" class="input" type="number" inputmode="numeric" min="1" placeholder="예: 4" autocomplete="off" />
          </label>
          <label class="field">
            <span class="label">1마틴 금액</span>
            <input id="baseBetInput" class="input" type="number" inputmode="numeric" min="0" placeholder="" autocomplete="off" />
          </label>
          <label class="field full">
            <span class="label">시작금액</span>
            <input id="startAmountInput" class="input" type="number" inputmode="numeric" min="0" placeholder="자동 계산 가능" autocomplete="off" />
          </label>
        </div>
        <div class="btn-row">
          <button id="startBtn" class="btn primary">게임 시작</button>
        </div>
        <div class="summary" id="summaryText">시작 전입니다. (시작금액+마틴횟수 → 1마틴 자동 / 1마틴+마틴횟수 → 시작금액 자동)</div>
      </section>
    </div>

    <div id="gamePage" class="page hidden">
      <section class="card">
        <h2 class="section-title">2p 게임</h2>
        <div class="game-stack">
          <div class="game-stat">
            <div class="game-stat-row">
              <div class="game-stat-split">
                <div class="game-stat-title">현재판</div>
                <div class="game-stat-value" id="roundInfo">-</div>
              </div>
              <div class="game-stat-split">
                <div class="game-stat-title">배팅금액</div>
                <div class="game-stat-value" id="betInfo">-</div>
              </div>
            </div>
          </div>

          <div id="shuffleBox" class="shuffle-box">
            <div class="table-glow"></div>
            <div class="deck-card left"></div>
            <div class="deck-card right"></div>
            <div id="resultSide" class="result-side">
              <div id="sideBadge" class="side-badge">대기중</div>
              <div class="side-meta" id="sideMeta">시작 버튼을 눌러 첫 판을 생성하세요.</div>
            </div>
          </div>

          <div class="game-actions">
            <button id="winBtn" class="btn win" disabled>승리</button>
            <button id="lossBtn" class="btn loss" disabled>패배</button>
            <button id="gameOverBtn" class="btn gameover hidden">게임종료</button>
          </div>

          <div class="game-reset">
            <button id="resetBtn" class="btn secondary">초기화</button>
          </div>

          <div class="game-stat">
            <div class="game-stat-title">총금액</div>
            <div class="game-stat-value" id="moneyInfo">-</div>
          </div>

          <div class="summary" id="gameSummaryText">게임 대기 중입니다.</div>
        </div>
      </section>
    </div>

    <section class="card hidden">
      <h2 class="section-title">진행 기록</h2>
      <div id="history" class="history empty">아직 진행 기록이 없습니다.</div>
      <div id="endBox" class="end-box hidden">
        <div class="end-title">진행 종료</div>
        <div class="end-grid">
          <div class="end-item">
            <div class="end-label">판 횟수</div>
            <div class="end-value" id="endRounds">0판</div>
          </div>
          <div class="end-item">
            <div class="end-label">시작금액</div>
            <div class="end-value" id="endStartAmount">0</div>
          </div>
          <div class="end-item">
            <div class="end-label">총 수익</div>
            <div class="end-value" id="endProfit">0</div>
          </div>
          <div class="end-item">
            <div class="end-label">총 금액</div>
            <div class="end-value" id="endTotalAmount">0</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const startAmountInput = $("startAmountInput");
    const baseBetInput = $("baseBetInput");
    const martinLimitInput = $("martinLimitInput");
    const setupPage = $("setupPage");
    const gamePage = $("gamePage");
    const startBtn = $("startBtn");
    const resetBtn = $("resetBtn");
    const winBtn = $("winBtn");
    const lossBtn = $("lossBtn");
    const gameOverBtn = $("gameOverBtn");
    const summaryText = $("summaryText");
    const gameSummaryText = $("gameSummaryText");
    const roundInfo = $("roundInfo");
    const betInfo = $("betInfo");
    const moneyInfo = $("moneyInfo");
    const shuffleBox = $("shuffleBox");
    const resultSide = $("resultSide");
    const sideBadge = $("sideBadge");
    const sideMeta = $("sideMeta");
    const history = $("history");
    const endBox = $("endBox");
    const endRounds = $("endRounds");
    const endStartAmount = $("endStartAmount");
    const endProfit = $("endProfit");
    const endTotalAmount = $("endTotalAmount");

    const state = {
      started: false,
      finished: false,
      awaitingDecision: false,
      roundNumber: 0,
      startAmount: 0,
      currentAmount: 0,
      totalProfit: 0,
      baseBet: 0,
      martinLimit: 0,
      currentMartinRound: 1,
      currentBet: 0,
      currentSide: null,
      history: []
    };

    const auto = {
      lastEdited: null, // "start" | "base"
      isUpdating: false
    };

    function formatMoney(value) {
      return new Intl.NumberFormat("ko-KR").format(value);
    }

    function getMartinBet(baseBet, martinRound) {
      return baseBet * ((2 ** martinRound) - 1);
    }

    function getRequiredStartAmount(baseBet, martinLimit) {
      // 합계: (2^2-1) ... (2^m-1) = (2^(m+1) - 2) - m = 2^(m+1) - m - 2
      const multiplier = (2 ** (martinLimit + 1)) - martinLimit - 2;
      return baseBet * multiplier;
    }

    function getBaseBetFromStartAmount(startAmount, martinLimit) {
      const divisor = (2 ** (martinLimit + 1)) - martinLimit - 2;
      if (divisor <= 0) return null;
      return startAmount / divisor;
    }

    function getRandomSide() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return (buf[0] & 1) === 0 ? "플레이어" : "뱅커";
    }

    function getNum(inputEl) {
      const raw = String(inputEl.value || "").trim();
      if (!raw) return null;
      const n = Number(raw);
      return Number.isFinite(n) ? n : null;
    }

    function setValueSafely(inputEl, value) {
      inputEl.value = value === null ? "" : String(value);
    }

    function recalcAutoFields(trigger) {
      if (auto.isUpdating) return;
      auto.isUpdating = true;
      try {
        const m = getNum(martinLimitInput);
        const s = getNum(startAmountInput);
        const b = getNum(baseBetInput);

        if (!m || m <= 0) return;

        // 1) 시작금액 + 마틴횟수 -> 1마틴 자동
        // 2) 1마틴 + 마틴횟수 -> 시작금액 자동
        // 둘 다 입력된 경우: 마지막 수정한 쪽을 기준으로 반대쪽을 맞춤
        if ((s !== null && s > 0) && (b === null || b === 0)) {
          const bb = getBaseBetFromStartAmount(s, m);
          if (bb !== null) {
            const bbRounded = Math.round(bb);
            setValueSafely(baseBetInput, bbRounded);
          }
          return;
        }

        if ((b !== null && b > 0) && (s === null || s === 0)) {
          const required = getRequiredStartAmount(b, m);
          setValueSafely(startAmountInput, required);
          return;
        }

        if ((s !== null && s > 0) && (b !== null && b > 0)) {
          // 둘 다 값이 있으면, 마지막 수정 값을 기준으로 다른 쪽을 재계산
          if (auto.lastEdited === "start" && trigger !== "base") {
            const bb = getBaseBetFromStartAmount(s, m);
            if (bb !== null) setValueSafely(baseBetInput, Math.round(bb));
          } else if (auto.lastEdited === "base" && trigger !== "start") {
            const required = getRequiredStartAmount(b, m);
            setValueSafely(startAmountInput, required);
          }
        }
      } finally {
        auto.isUpdating = false;
      }
    }

    function setDecisionButtons(enabled) {
      winBtn.disabled = !enabled;
      lossBtn.disabled = !enabled;
    }

    function showPage(page) {
      setupPage.classList.toggle("hidden", page !== "setup");
      gamePage.classList.toggle("hidden", page !== "game");
    }

    function setGameOverButton(visible) {
      gameOverBtn.classList.toggle("hidden", !visible);
      winBtn.classList.toggle("hidden", visible);
      lossBtn.classList.toggle("hidden", visible);
    }

    function updateStatus() {
      roundInfo.textContent = state.started && state.roundNumber > 0
        ? `${state.roundNumber}판`
        : "-";
      betInfo.textContent = state.started
        ? `${formatMoney(state.currentBet)}`
        : "-";
      moneyInfo.textContent = state.started
        ? `${formatMoney(state.currentAmount)}`
        : "-";
    }

    function renderHistory() {
      if (state.history.length === 0) {
        history.className = "history empty";
        history.innerHTML = "아직 진행 기록이 없습니다.";
        return;
      }

      history.className = "history";
      history.innerHTML = state.history.map(item => `
        <div class="history-item">
          <div class="history-top">
            <div class="history-round">${item.round}판 · ${item.martinRound}마틴</div>
            <div class="history-status ${item.result === "승리" ? "win" : "loss"}">${item.result}</div>
          </div>
          <div class="history-grid">
            <div>타겟: <strong class="${item.side === "플레이어" ? "player" : "banker"}">${item.side}</strong></div>
            <div>배팅금액: <strong>${formatMoney(item.bet)}</strong></div>
            <div>변동금액: <strong>${item.delta >= 0 ? "+" : ""}${formatMoney(item.delta)}</strong></div>
            <div>총 금액: <strong>${formatMoney(item.totalAmount)}</strong></div>
          </div>
        </div>
      `).join("");
    }

    function showResult(side, round, martinRound, bet) {
      resultSide.classList.add("show");
      sideBadge.textContent = side;
      sideBadge.className = `side-badge ${side === "플레이어" ? "player" : "banker"}`;
      sideMeta.textContent = `${round}판 · ${martinRound}마틴 · 배팅금액 ${formatMoney(bet)}`;
    }

    function setIdleMessage(message) {
      resultSide.classList.add("show");
      sideBadge.textContent = "대기중";
      sideBadge.className = "side-badge";
      sideMeta.textContent = message;
    }

    function finishGame(reason, showGameOverButton = false) {
      state.finished = true;
      state.awaitingDecision = false;
      setDecisionButtons(false);
      setGameOverButton(showGameOverButton);
      startBtn.disabled = false;
      summaryText.textContent = reason;
      gameSummaryText.textContent = reason;
      endRounds.textContent = `${state.roundNumber}판`;
      endStartAmount.textContent = formatMoney(state.startAmount);
      endProfit.textContent = `${state.totalProfit >= 0 ? "+" : ""}${formatMoney(state.totalProfit)}`;
      endTotalAmount.textContent = formatMoney(state.currentAmount);
      endBox.classList.remove("hidden");
      setIdleMessage(reason);
      updateStatus();
    }

    function requestNextRound() {
      if (state.finished) return;

      state.awaitingDecision = false;
      setDecisionButtons(false);
      setGameOverButton(false);
      resultSide.classList.remove("show");
      shuffleBox.classList.add("active");

      const nextRound = state.roundNumber + 1;
      const nextBet = getMartinBet(state.baseBet, state.currentMartinRound);

      if (state.currentAmount < nextBet) {
        shuffleBox.classList.remove("active");
        finishGame(`진행 종료. 총 금액이 다음 배팅금액 ${formatMoney(nextBet)}보다 부족합니다.`, true);
        return;
      }

      roundInfo.textContent = `${nextRound}판`;
      betInfo.textContent = `${formatMoney(nextBet)}`;
      summaryText.textContent = `${nextRound}판 생성 중... 카드 셔플 후 결과가 공개됩니다.`;
      gameSummaryText.textContent = `${nextRound}판 생성 중... 카드 셔플 후 결과가 공개됩니다.`;

      window.setTimeout(() => {
        shuffleBox.classList.remove("active");
        state.roundNumber = nextRound;
        state.currentBet = nextBet;
        state.currentSide = getRandomSide();
        state.awaitingDecision = true;
        showResult(state.currentSide, state.roundNumber, state.currentMartinRound, state.currentBet);
        summaryText.textContent = `${state.roundNumber}판 결과가 나왔습니다. 승리 또는 패배를 선택하세요.`;
        gameSummaryText.textContent = `${state.roundNumber}판 결과가 나왔습니다. 승리 또는 패배를 선택하세요.`;
        updateStatus();
        setDecisionButtons(true);
      }, 500);
    }

    function recordRound(result) {
      if (!state.awaitingDecision || state.finished) return;

      let delta = 0;
      if (result === "승리") {
        delta = state.currentBet;
        state.totalProfit += delta;
        state.currentAmount += delta;
      } else {
        delta = -state.currentBet;
        state.totalProfit += delta;
        state.currentAmount += delta;
      }

      state.history.unshift({
        round: state.roundNumber,
        martinRound: state.currentMartinRound,
        side: state.currentSide,
        bet: state.currentBet,
        delta,
        totalAmount: state.currentAmount,
        result
      });
      renderHistory();

      if (result === "승리") {
        summaryText.textContent = `${state.roundNumber}판 승리 처리 완료. 다음 판은 1마틴으로 다시 시작합니다.`;
        gameSummaryText.textContent = `${state.roundNumber}판 승리 처리 완료. 다음 판은 1마틴으로 다시 시작합니다.`;
        state.currentMartinRound = 1;
      } else if (state.currentMartinRound >= state.martinLimit) {
        finishGame(`진행 종료. ${state.martinLimit}마틴까지 모두 패배했습니다.`, true);
        return;
      } else {
        state.currentMartinRound += 1;
        summaryText.textContent = `${state.roundNumber}판 패배 처리 완료. 다음 판은 ${state.currentMartinRound}마틴으로 진행합니다.`;
        gameSummaryText.textContent = `${state.roundNumber}판 패배 처리 완료. 다음 판은 ${state.currentMartinRound}마틴으로 진행합니다.`;
      }

      updateStatus();
      requestNextRound();
    }

    function resetGame() {
      state.started = false;
      state.finished = false;
      state.awaitingDecision = false;
      state.roundNumber = 0;
      state.startAmount = 0;
      state.currentAmount = 0;
      state.totalProfit = 0;
      state.baseBet = 0;
      state.martinLimit = 0;
      state.currentMartinRound = 1;
      state.currentBet = 0;
      state.currentSide = null;
      state.history = [];

      startAmountInput.value = "";
      baseBetInput.value = "";
      martinLimitInput.value = "";

      history.className = "history empty";
      history.innerHTML = "아직 진행 기록이 없습니다.";
      endBox.classList.add("hidden");
      startBtn.disabled = false;
      setDecisionButtons(false);
      setGameOverButton(false);
      setIdleMessage("시작 버튼을 눌러 첫 판을 생성하세요.");
      summaryText.textContent = "시작 전입니다. (시작금액+마틴횟수 → 1마틴 자동 / 1마틴+마틴횟수 → 시작금액 자동)";
      gameSummaryText.textContent = "게임 대기 중입니다.";
      showPage("setup");
      updateStatus();
    }

    function startGame() {
      // 자동계산 반영 후 시작
      recalcAutoFields("start");

      const startAmount = Number(String(startAmountInput.value || "").trim());
      const baseBet = Number(String(baseBetInput.value || "").trim());
      const martinLimit = Number(String(martinLimitInput.value || "").trim());

      if (!Number.isFinite(startAmount) || startAmount <= 0) {
        alert("시작금액은 1 이상으로 입력하세요.");
        return;
      }
      if (!Number.isFinite(baseBet) || baseBet <= 0) {
        alert("1마틴 금액은 1 이상으로 입력하세요.");
        return;
      }
      if (!Number.isInteger(martinLimit) || martinLimit <= 0) {
        alert("마틴횟수는 1 이상의 정수로 입력하세요.");
        return;
      }
      if (startAmount < getMartinBet(baseBet, 1)) {
        alert("시작금액이 1마틴 배팅금액보다 작습니다.");
        return;
      }

      state.started = true;
      state.finished = false;
      state.awaitingDecision = false;
      state.roundNumber = 0;
      state.startAmount = startAmount;
      state.currentAmount = startAmount;
      state.totalProfit = 0;
      state.baseBet = baseBet;
      state.martinLimit = martinLimit;
      state.currentMartinRound = 1;
      state.currentBet = getMartinBet(baseBet, 1);
      state.currentSide = null;
      state.history = [];

      history.className = "history empty";
      history.innerHTML = "아직 진행 기록이 없습니다.";
      endBox.classList.add("hidden");
      startBtn.disabled = true;
      setDecisionButtons(false);
      setGameOverButton(false);
      showPage("game");
      updateStatus();
      requestNextRound();
    }

    startBtn.addEventListener("click", startGame);
    resetBtn.addEventListener("click", resetGame);
    winBtn.addEventListener("click", () => recordRound("승리"));
    lossBtn.addEventListener("click", () => recordRound("패배"));
    gameOverBtn.addEventListener("click", resetGame);

    startAmountInput.addEventListener("input", () => {
      auto.lastEdited = "start";
      recalcAutoFields("start");
    });
    baseBetInput.addEventListener("input", () => {
      auto.lastEdited = "base";
      recalcAutoFields("base");
    });
    martinLimitInput.addEventListener("input", () => {
      recalcAutoFields("martin");
    });

    [startAmountInput, baseBetInput, martinLimitInput].forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (!state.started || state.finished) startGame();
        }
      });
    });

    setIdleMessage("시작 버튼을 눌러 첫 판을 생성하세요.");
    setGameOverButton(false);
    showPage("setup");
    updateStatus();
  </script>
</body>
</html>
